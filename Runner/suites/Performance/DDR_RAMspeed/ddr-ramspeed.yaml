metadata:
  name: ddr-ramspeed
  format: "Lava-Test Test Definition 1.0"
  description: >
    DDR speed via RAMspeed / RAMsmp. Runs the INTmem and FLOATmem benchmarks
    by default, which exercise the STREAM-style Copy, Scale, Add and Triad
    kernels, and publishes each kernel plus the AVERAGE to LAVA as a
    measurement in MB/s. The block-sweeping *mark benchmarks are also
    supported and are reported per block size. SKIPs cleanly when neither
    ramspeed nor ramsmp is present in the image.
  os:
    - linux
  scope:
    - performance

params:
  OUT_DIR: "./logs_DDR_RAMspeed"
  # RAMspeed -b indices. 3 = INTmem, 6 = FLOATmem.
  BENCHMARKS: "3 6"
  # Gbytes moved per pass (-g). Larger is steadier but slower.
  GB_PER_PASS: "1"
  LOOPS: "1"
  # Block size in Kbytes (-m); only meaningful for the *mark benchmarks.
  BLOCK_KB: ""
  # Process count (-p); ramsmp only, ignored for uniprocessor ramspeed.
  PROCESSES: ""
  ITERATIONS: "1"
  RAMSPEED_BIN: ""
  RAMSPEED_DIR: ""
  EXTRA_ARGS: ""
  SET_PERF_GOV: "1"
  TIMEOUT_SEC: "1800"

run:
  steps:
    - 'REPO_PATH="$PWD"'
    - 'cd Runner/suites/Performance/DDR_RAMspeed || exit 0'
    - >
      ./run.sh
      --out-dir "$OUT_DIR"
      --benchmarks "$BENCHMARKS"
      --gb-per-pass "$GB_PER_PASS"
      --loops "$LOOPS"
      --block-kb "$BLOCK_KB"
      --processes "$PROCESSES"
      --iterations "$ITERATIONS"
      --binary "$RAMSPEED_BIN"
      --ramspeed-dir "$RAMSPEED_DIR"
      --extra-args "$EXTRA_ARGS"
      --set-perf-gov "$SET_PERF_GOV"
      --timeout-sec "$TIMEOUT_SEC"
      || true
    - '$REPO_PATH/Runner/utils/send-metrics-to-lava.sh "$OUT_DIR/metrics.txt" || true'
    - '$REPO_PATH/Runner/utils/send-to-lava.sh DDR_RAMspeed.res'
