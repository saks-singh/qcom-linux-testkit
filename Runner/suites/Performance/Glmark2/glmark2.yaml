metadata:
  name: glmark2-performance
  format: "Lava-Test Test Definition 1.0"
  description: >
    glmark2 OpenGL / OpenGL ES 2.0 benchmark. Publishes the overall glmark2
    Score and the per-scene FPS to LAVA as measurements. This is the
    performance counterpart to Multimedia/Graphics/X11_Glmark2, which
    validates rendering inside a real XFCE session and reports only a verdict;
    this one takes whichever window system the board has (adopting a running
    Wayland session when there is one, else X11, else DRM/KMS with no
    compositor) and is after the score.
  os:
    - linux
  scope:
    - performance
    - graphics

params:
  OUT_DIR: "./logs_Glmark2"

  # Window system family. glmark2 selects it by binary name, so this chooses
  # which binary is looked for: auto|wayland|x11|drm.
  FLAVOUR: "auto"

  # Empty uses glmark2's own default (800x600 on most builds). Pin a size when
  # comparing boards: the score scales with the pixel count.
  SIZE: ""
  FULLSCREEN: "0"
  OFFSCREEN: "0"

  # Empty runs glmark2's default scene list. The score is the sum over the
  # scenes that ran, so changing this changes the scale of the score.
  BENCHMARKS: ""

  ITERATIONS: "1"
  PER_SCENE: "1"

  BINARY: ""
  GLMARK2_DIR: ""
  EXTRA_ARGS: ""

  # Off by default: starting a compositor changes what is being measured, and
  # on a board with no display session DRM/KMS is the better path.
  START_WESTON: "0"

  SET_PERF_GOV: "1"
  TIMEOUT_SEC: "900"

run:
  steps:
    - 'REPO_PATH="$PWD"'
    - 'cd Runner/suites/Performance/Glmark2 || exit 0'
    - >
      ./run.sh
      --out-dir "$OUT_DIR"
      --flavour "$FLAVOUR"
      --size "$SIZE"
      --fullscreen "$FULLSCREEN"
      --off-screen "$OFFSCREEN"
      --benchmarks "$BENCHMARKS"
      --iterations "$ITERATIONS"
      --per-scene "$PER_SCENE"
      --binary "$BINARY"
      --glmark2-dir "$GLMARK2_DIR"
      --extra-args "$EXTRA_ARGS"
      --start-weston "$START_WESTON"
      --set-perf-gov "$SET_PERF_GOV"
      --timeout-sec "$TIMEOUT_SEC"
      || true
    # No expected: list in the job definition for this suite - the per-scene
    # case ids come from glmark2's own output and are not known in advance.
    - '$REPO_PATH/Runner/utils/send-metrics-to-lava.sh "$OUT_DIR/metrics.txt" || true'
    - '$REPO_PATH/Runner/utils/send-to-lava.sh Glmark2.res'
