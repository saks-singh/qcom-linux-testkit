metadata:
  name: sysbench-performance
  format: "Lava-Test Test Definition 1.0"
  description: "Sysbench performance suite (CPU / memory / threads / mutex + fileio seqwr/seqrd/rndwr/rndrd) with per-iteration logs + summary averages + optional baseline gating."
  os:
    - linux
  scope:
    - performance
    - functional

params:
  OUT_DIR: "./logs_Sysbench_Performance"

  # Iteration controls
  ITERATIONS: "3"
  TIME: "30"
  RAND_SEED: "1234"
  THREADS_LIST: "4"

  # CPU
  CPU_MAX_PRIME: "20000"

  # Threads test
  THREAD_LOCKS: "20"
  THREAD_YIELDS: ""

  # Memory test
  MEMORY_OPER: "write"
  MEMORY_ACCESS_MODE: "rnd"
  MEMORY_BLOCK_SIZE: "1M"
  MEMORY_TOTAL_SIZE: "100G"

  # Mutex test
  MUTEX_NUM: ""
  MUTEX_LOCKS: ""
  MUTEX_LOOPS: ""

  # Core pinning (optional)
  TASKSET_CPU_LIST: ""

  # Baselines + thresholds (optional gating)
  BASELINE_FILE: ""
  ALLOWED_DEVIATION: "0.10"

  # Optional CSV append. Defaulted to a path under OUT_DIR because the CSV is
  # what carries the scores out to LAVA: run.sh only writes it when --csv is
  # given, and with it empty the job reports a bare pass/fail and no numbers.
  CSV_FILE: "./logs_Sysbench_Performance/sysbench_metrics.csv"

  VERBOSE: "0"

  # ---------------- FileIO (storage-backed) ----------------
  FILEIO_DIR: "/var/tmp/sysbench_fileio"
  FILEIO_TOTAL_SIZE: "1G"
  FILEIO_NUM: "64"
  FILEIO_BLOCK_SIZE: "4K"
  FILEIO_IO_MODE: "sync"
  FILEIO_FSYNC_FREQ: "0"
  FILEIO_EXTRA_FLAGS: "none"

  # If/when run.sh supports it:
  # FILEIO_MODE_LIST: "seqwr seqrd rndwr rndrd"

run:
  steps:
    - REPO_PATH=$PWD
    - cd Runner/suites/Performance/Sysbench_Performance/

    # Explicitly forward params to run.sh (best practice).
    #
    # These flag names must match run.sh's option parser exactly. They
    # previously used the uppercase param names (--OUT_DIR, --ITERATIONS, ...)
    # which run.sh does not accept: its parser has only the lowercase forms,
    # and its catch-all arm does "exit 2". The very first flag therefore
    # aborted the script before a single benchmark ran - and because it exited
    # 2 without writing Sysbench_Performance.res, the failure surfaced as a
    # missing result rather than as a visible error.
    - >
      ./run.sh
      --out-dir "$OUT_DIR"
      --iterations "$ITERATIONS"
      --time "$TIME"
      --seed "$RAND_SEED"
      --threads-list "$THREADS_LIST"
      --cpu-max-prime "$CPU_MAX_PRIME"
      --thread-locks "$THREAD_LOCKS"
      --thread-yields "$THREAD_YIELDS"
      --mem-oper "$MEMORY_OPER"
      --mem-access-mode "$MEMORY_ACCESS_MODE"
      --mem-block-size "$MEMORY_BLOCK_SIZE"
      --mem-total-size "$MEMORY_TOTAL_SIZE"
      --mutex-num "$MUTEX_NUM"
      --mutex-locks "$MUTEX_LOCKS"
      --mutex-loops "$MUTEX_LOOPS"
      --taskset-cpu-list "$TASKSET_CPU_LIST"
      --baseline "$BASELINE_FILE"
      --delta "$ALLOWED_DEVIATION"
      --csv "$CSV_FILE"
      --verbose "$VERBOSE"
      --fileio-dir "$FILEIO_DIR"
      --fileio-total-size "$FILEIO_TOTAL_SIZE"
      --fileio-num "$FILEIO_NUM"
      --fileio-block-size "$FILEIO_BLOCK_SIZE"
      --fileio-io-mode "$FILEIO_IO_MODE"
      --fileio-fsync-freq "$FILEIO_FSYNC_FREQ"
      --fileio-extra-flags "$FILEIO_EXTRA_FLAGS"
      || true

    # Publish the scores, not just the verdict.
    - >
      $REPO_PATH/Runner/utils/metrics-from-sysbench-csv.sh
      "$CSV_FILE" "$OUT_DIR/metrics.txt" || true
    - '$REPO_PATH/Runner/utils/send-metrics-to-lava.sh "$OUT_DIR/metrics.txt" || true'
    - $REPO_PATH/Runner/utils/send-to-lava.sh Sysbench_Performance.res
