metadata:
  name: vkmark
  format: "Lava-Test Test Definition 1.0"
  description: >
    vkmark Vulkan graphics benchmark. Publishes the overall vkmark Score and,
    by default, the FPS of every scene as LAVA measurements. The present
    window system is chosen automatically - an existing Wayland session if
    there is one, otherwise KMS, which needs no compositor and suits a
    headless board. The Vulkan counterpart to
    Multimedia/Graphics/X11_Glmark2. SKIPs cleanly when vkmark or a DRM
    device is absent.
  os:
    - linux
  scope:
    - performance

params:
  OUT_DIR: "./logs_Vkmark"
  # auto|wayland|xcb|kms. auto adopts a running Wayland session, else kms.
  WINSYS: "auto"
  # Window size, e.g. 1920x1080. Empty uses vkmark's own default.
  # Scores are only comparable between runs at the same size.
  SIZE: ""
  FULLSCREEN: "0"
  # vkmark -b scene specs, space separated. Empty runs the default scene list.
  BENCHMARKS: ""
  ITERATIONS: "1"
  PER_SCENE: "1"
  BINARY: ""
  VKMARK_DIR: ""
  EXTRA_ARGS: ""
  # Start Weston when no Wayland session is up. Off by default so the test
  # measures the platform as the job left it.
  START_WESTON: "0"
  TIMEOUT_SEC: "600"

run:
  steps:
    - 'REPO_PATH="$PWD"'
    - 'cd Runner/suites/Performance/Vkmark || exit 0'
    - >
      ./run.sh
      --out-dir "$OUT_DIR"
      --winsys "$WINSYS"
      --size "$SIZE"
      --fullscreen "$FULLSCREEN"
      --benchmarks "$BENCHMARKS"
      --iterations "$ITERATIONS"
      --per-scene "$PER_SCENE"
      --binary "$BINARY"
      --vkmark-dir "$VKMARK_DIR"
      --extra-args "$EXTRA_ARGS"
      --start-weston "$START_WESTON"
      --timeout-sec "$TIMEOUT_SEC"
      || true
    - '$REPO_PATH/Runner/utils/send-metrics-to-lava.sh "$OUT_DIR/metrics.txt" || true'
    - '$REPO_PATH/Runner/utils/send-to-lava.sh Vkmark.res'
