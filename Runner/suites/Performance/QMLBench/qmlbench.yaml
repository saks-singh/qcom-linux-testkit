metadata:
  name: qmlbench
  format: "Lava-Test Test Definition 1.0"
  description: >
    qmlbench 1.1.0 Qt Quick benchmark, which loads GPU and CPU together - the
    scene graph renders on the GPU while QML/JS runs on the CPU. Publishes
    each benchmark's average, and the overall score when the shell reports
    one, as LAVA measurements. The unit is taken from qmlbench's own output,
    so frame-count runs are reported in fps and static-count runs in ops/s.
    The QPA platform defaults to wayland when a session is present and eglfs
    otherwise. SKIPs cleanly when qmlbench, a DRM device, or the benchmark
    set is absent.
  os:
    - linux
  scope:
    - performance

params:
  OUT_DIR: "./logs_QMLBench"
  # .qml files or directories to run. Empty uses BENCH_DIR, else the
  # benchmarks installed alongside qmlbench.
  BENCHMARKS: ""
  BENCH_DIR: ""
  # qmlbench --shell, e.g. frame-count (fps) or static-count (ops/s).
  # Empty uses qmlbench's own default.
  SHELL_MODE: ""
  SAMPLES: ""
  FULLSCREEN: "0"
  # auto|wayland|eglfs|xcb. auto adopts a Wayland session, else eglfs.
  QPA: "auto"
  BINARY: ""
  QMLBENCH_DIR: ""
  EXTRA_ARGS: ""
  ITERATIONS: "1"
  TIMEOUT_SEC: "1800"

run:
  steps:
    - 'REPO_PATH="$PWD"'
    - 'cd Runner/suites/Performance/QMLBench || exit 0'
    - >
      ./run.sh
      --out-dir "$OUT_DIR"
      --benchmarks "$BENCHMARKS"
      --bench-dir "$BENCH_DIR"
      --shell "$SHELL_MODE"
      --samples "$SAMPLES"
      --fullscreen "$FULLSCREEN"
      --qpa "$QPA"
      --binary "$BINARY"
      --qmlbench-dir "$QMLBENCH_DIR"
      --extra-args "$EXTRA_ARGS"
      --iterations "$ITERATIONS"
      --timeout-sec "$TIMEOUT_SEC"
      || true
    - '$REPO_PATH/Runner/utils/send-metrics-to-lava.sh "$OUT_DIR/metrics.txt" || true'
    - '$REPO_PATH/Runner/utils/send-to-lava.sh QMLBench.res'
