metadata:
  name: sockperf
  format: "Lava-Test Test Definition 1.0"
  description: >
    sockperf socket latency and throughput benchmark. Runs ping-pong and
    throughput modes by default (under-load is also available) and publishes
    average latency, the latency percentiles sockperf prints, message rate,
    bandwidth and dropped-message counts as LAVA measurements. By default a
    server is started on the DUT and the test runs over loopback, which
    measures the kernel network stack and the scheduler but NOT the NIC or
    the link; set SERVER_IP to a real peer running sockperf server for a
    figure that includes the interface. SKIPs cleanly when sockperf is absent.
  os:
    - linux
  scope:
    - performance

params:
  OUT_DIR: "./logs_Sockperf"
  # ping-pong (latency), throughput (rate/bandwidth), under-load (both).
  MODES: "ping-pong throughput"
  # Loopback by default. Point this at a peer running "sockperf server" to
  # include the NIC and the link in the measurement.
  SERVER_IP: "127.0.0.1"
  PORT: "11111"
  PROTOCOL: "udp"
  MSG_SIZE: "64"
  TIME_SEC: "10"
  # Messages per second, or "max". Empty uses sockperf's own default.
  MPS: ""
  # auto|1|0. auto starts a local server only for a loopback SERVER_IP.
  START_SERVER: "auto"
  SERVER_WAIT_SEC: "5"
  ITERATIONS: "1"
  BINARY: ""
  SOCKPERF_DIR: ""
  EXTRA_ARGS: ""
  SET_PERF_GOV: "1"
  TIMEOUT_SEC: "300"

run:
  steps:
    - 'REPO_PATH="$PWD"'
    - 'cd Runner/suites/Performance/Sockperf || exit 0'
    - >
      ./run.sh
      --out-dir "$OUT_DIR"
      --modes "$MODES"
      --server-ip "$SERVER_IP"
      --port "$PORT"
      --protocol "$PROTOCOL"
      --msg-size "$MSG_SIZE"
      --time-sec "$TIME_SEC"
      --mps "$MPS"
      --start-server "$START_SERVER"
      --server-wait-sec "$SERVER_WAIT_SEC"
      --iterations "$ITERATIONS"
      --binary "$BINARY"
      --sockperf-dir "$SOCKPERF_DIR"
      --extra-args "$EXTRA_ARGS"
      --set-perf-gov "$SET_PERF_GOV"
      --timeout-sec "$TIMEOUT_SEC"
      || true
    - '$REPO_PATH/Runner/utils/send-metrics-to-lava.sh "$OUT_DIR/metrics.txt" || true'
    - '$REPO_PATH/Runner/utils/send-to-lava.sh Sockperf.res'
