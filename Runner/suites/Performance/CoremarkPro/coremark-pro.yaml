metadata:
  name: coremark-pro
  format: "Lava-Test Test Definition 1.0"
  description: >
    EEMBC CoreMark-PRO benchmark. Runs the certify-all procedure and reports
    the MARK RESULTS TABLE as LAVA measurements: MultiCore and SingleCore
    scores in iter/s plus the Scaling ratio between them. Optionally reports
    every row of the WORKLOAD RESULTS TABLE as well. By default it runs the
    workload binaries the image ships in /usr/bin (meta-oe coremark-pro);
    SKIPs cleanly when they are not present.
  os:
    - linux
  scope:
    - performance

params:
  OUT_DIR: "./logs_CoremarkPro"
  # Directory holding the nine workload binaries (<workload> or
  # <workload>.exe). Empty means find them in /usr/bin or on PATH.
  CMP_BIN_DIR: ""
  # CoreMark-PRO source tree (the directory containing builds/ and util/),
  # used instead of image binaries. Empty means do not use a tree.
  CMP_DIR: ""
  # EEMBC TARGET passed to make (source tree only).
  TARGET: "linux64"
  # Workers for the multicore pass. NPROC means all online CPUs.
  CORES: "NPROC"
  # Override the -c context count; empty derives it from CORES.
  CONTEXTS: ""
  # Replace the built-in invocation entirely.
  RUN_CMD: ""
  # Parse an existing log instead of running anything.
  FROM_LOG: ""
  # Emit a measurement per workload row as well as the overall mark.
  PER_WORKLOAD: "1"
  SET_PERF_GOV: "1"
  # certify-all is long; allow an hour by default.
  TIMEOUT_SEC: "3600"

run:
  steps:
    - 'REPO_PATH="$PWD"'
    - 'cd Runner/suites/Performance/CoremarkPro || exit 0'
    - >
      ./run.sh
      --out-dir "$OUT_DIR"
      --bin-dir "$CMP_BIN_DIR"
      --dir "$CMP_DIR"
      --target "$TARGET"
      --cores "$CORES"
      --contexts "$CONTEXTS"
      --run-cmd "$RUN_CMD"
      --from-log "$FROM_LOG"
      --per-workload "$PER_WORKLOAD"
      --set-perf-gov "$SET_PERF_GOV"
      --timeout-sec "$TIMEOUT_SEC"
      || true
    - '$REPO_PATH/Runner/utils/send-metrics-to-lava.sh "$OUT_DIR/metrics.txt" || true'
    - '$REPO_PATH/Runner/utils/send-to-lava.sh CoremarkPro.res'
