metadata:
  name: coremark-pro
  format: "Lava-Test Test Definition 1.0"
  description: >
    EEMBC CoreMark-PRO benchmark. Drives the certify-all run and reports the
    MARK RESULTS TABLE as LAVA measurements: MultiCore and SingleCore scores
    in iter/s plus the Scaling ratio between them. Optionally reports every
    row of the WORKLOAD RESULTS TABLE as well. The tree can be fetched onto
    the device at run time (CMP_URL); without make and perl, prebuilt
    workload binaries are run by certify.sh with the same procedure. SKIPs
    cleanly when no CoreMark-PRO tree can be found or fetched.
  os:
    - linux
  scope:
    - performance

params:
  OUT_DIR: "./logs_CoremarkPro"
  # CoreMark-PRO source tree (the directory containing builds/ and util/).
  # Empty means search the suite dir, /opt, /usr/share and $HOME.
  CMP_DIR: ""
  # Fetch a .tar.gz holding coremark-pro/ onto the running device first,
  # instead of baking the tree into the image. Needs device networking.
  # CMP_URL_AUTH, if set, is sent as the Authorization header.
  # CMP_URL_SECRET names a variable in the job's `secrets:` block (which may
  # hold a remote artifact token name, so the job never carries the secret);
  # its value is sent as "Authorization: Bearer <value>".
  CMP_URL: ""
  CMP_URL_AUTH: ""
  CMP_URL_SECRET: ""
  # EEMBC TARGET passed to make. linux64 for 64-bit Arm userspace.
  TARGET: "linux64"
  # Workers for the multicore pass. NPROC means all online CPUs.
  CORES: "NPROC"
  # Override the -c context count; empty derives it from CORES.
  CONTEXTS: ""
  # Replace the built-in make invocation entirely, if your image ships
  # CoreMark-PRO in some other form.
  RUN_CMD: ""
  # Parse an existing log instead of running anything.
  FROM_LOG: ""
  # Emit a measurement per workload row as well as the overall mark.
  PER_WORKLOAD: "1"
  SET_PERF_GOV: "1"
  # certify-all is long; allow an hour by default.
  TIMEOUT_SEC: "3600"

run:
  steps:
    - 'REPO_PATH="$PWD"'
    - 'cd Runner/suites/Performance/CoremarkPro || exit 0'
    - >
      if [ -n "$CMP_URL_SECRET" ] && [ -z "$CMP_URL_AUTH" ]; then
      lava_dir="$(find /lava-* -maxdepth 0 -type d 2>/dev/null | grep -E '^/lava-[0-9]+' | sort | tail -1)";
      if [ -f "$lava_dir/secrets" ]; then . "$lava_dir/secrets"; fi;
      eval "cmp_secret=\${$CMP_URL_SECRET:-}";
      if [ -n "$cmp_secret" ]; then CMP_URL_AUTH="Bearer $cmp_secret"; else echo "CMP_URL_SECRET $CMP_URL_SECRET not found in LAVA secrets"; fi;
      fi
    - >
      CMP_URL_AUTH="$CMP_URL_AUTH" ./run.sh
      --out-dir "$OUT_DIR"
      --dir "$CMP_DIR"
      --url "$CMP_URL"
      --target "$TARGET"
      --cores "$CORES"
      --contexts "$CONTEXTS"
      --run-cmd "$RUN_CMD"
      --from-log "$FROM_LOG"
      --per-workload "$PER_WORKLOAD"
      --set-perf-gov "$SET_PERF_GOV"
      --timeout-sec "$TIMEOUT_SEC"
      || true
    - '$REPO_PATH/Runner/utils/send-metrics-to-lava.sh "$OUT_DIR/metrics.txt" || true'
    - '$REPO_PATH/Runner/utils/send-to-lava.sh CoremarkPro.res'
