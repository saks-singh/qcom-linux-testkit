metadata:
  name: wrk-http
  format: "Lava-Test Test Definition 1.0"
  description: >
    HTTP load testing with wrk or wrk2. Publishes requests/sec,
    transfer/sec, latency average/stdev/max, the wrk2 HdrHistogram
    percentiles, and socket-error and non-2xx counts as LAVA measurements.
    Latencies are normalised to ms and transfer rates to MB/s so runs are
    comparable whatever units wrk printed. With no URL, a throwaway HTTP
    server is started on loopback, which measures the kernel stack and the
    server process but not a NIC or a link; set URL to a real endpoint to
    include those. Setting RATE requires a wrk2-capable binary and the suite
    SKIPs rather than silently dropping the flag.
  os:
    - linux
  scope:
    - performance

params:
  OUT_DIR: "./logs_Wrk_HTTP"
  # Target URL. Empty starts a local throwaway server on loopback.
  URL: ""
  DURATION: "30s"
  # NPROC resolves to all online CPUs.
  THREADS: "NPROC"
  CONNECTIONS: "100"
  # wrk2 -R, requests per second. Required for a rate-corrected latency
  # distribution; needs a wrk2-capable binary.
  RATE: ""
  LATENCY: "1"
  LUA_SCRIPT: ""
  HEADER: ""
  ITERATIONS: "1"
  BINARY: ""
  WRK_DIR: ""
  EXTRA_ARGS: ""
  # auto|1|0. auto starts a local server only when URL is empty.
  START_SERVER: "auto"
  SERVER_PORT: "8080"
  # Command for the local server; empty auto-detects python3 or busybox httpd.
  SERVER_CMD: ""
  PAYLOAD_KB: "4"
  SERVER_WAIT_SEC: "10"
  SET_PERF_GOV: "1"
  TIMEOUT_SEC: "600"

run:
  steps:
    - 'REPO_PATH="$PWD"'
    - 'cd Runner/suites/Performance/Wrk_HTTP || exit 0'
    - >
      ./run.sh
      --out-dir "$OUT_DIR"
      --url "$URL"
      --duration "$DURATION"
      --threads "$THREADS"
      --connections "$CONNECTIONS"
      --rate "$RATE"
      --latency "$LATENCY"
      --lua-script "$LUA_SCRIPT"
      --header "$HEADER"
      --iterations "$ITERATIONS"
      --binary "$BINARY"
      --wrk-dir "$WRK_DIR"
      --extra-args "$EXTRA_ARGS"
      --start-server "$START_SERVER"
      --server-port "$SERVER_PORT"
      --server-cmd "$SERVER_CMD"
      --payload-kb "$PAYLOAD_KB"
      --server-wait-sec "$SERVER_WAIT_SEC"
      --set-perf-gov "$SET_PERF_GOV"
      --timeout-sec "$TIMEOUT_SEC"
      || true
    - '$REPO_PATH/Runner/utils/send-metrics-to-lava.sh "$OUT_DIR/metrics.txt" || true'
    - '$REPO_PATH/Runner/utils/send-to-lava.sh Wrk_HTTP.res'
